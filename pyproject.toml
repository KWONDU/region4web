[project]
name = "region4web"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "benchmarks*", "core*", "extraction*", "framework*", "pipeline*", "training*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
